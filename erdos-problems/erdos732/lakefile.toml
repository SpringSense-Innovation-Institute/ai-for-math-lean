name = "erdos732"
version = "0.1.0"
defaultTargets = ["LeanProject", "Challenge", "Solution"]

[leanOptions]
relaxedAutoImplicit = false
maxSynthPendingDepth = 3
warningAsError = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "065356127b1dc0016f66b7283ce0ce2c4055aa55"

[[lean_lib]]
name = "LeanProject"
roots = ["LeanProject"]

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
